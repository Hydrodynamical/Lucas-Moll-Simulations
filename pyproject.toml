[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lucas-moll-simulations"
version = "0.1.0"
description = "Particle and kinetic PDE simulations with a prescribed Lucas–Moll learning rule"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "pillow>=10,<13"]

[project.optional-dependencies]
legacy = ["pandas>=2,<3", "tqdm>=4,<5"]
dev = ["ruff>=0.9,<1"]

[project.scripts]
lucas-moll = "lucas_moll.__main__:main"

[tool.setuptools.packages.find]
include = ["lucas_moll*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
